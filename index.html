<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지도로 보는 6·25 전쟁</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
/* 한 화면 표지: 기록실 책상 위 지도 그림을 바탕으로, 왼쪽에 제목과 두 판 단추만 둔다 */
:root {
  --ink: #07090d; --paper: #f4ead2; --paper-dim: #c9bea4; --gold: #e6c878; --gold-2: #c9a24a; --rok: #6f97d6;
  --display: 'Noto Serif KR', 'Nanum Myeongjo', serif;
  --body: 'IBM Plex Sans KR', 'Noto Sans KR', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); font: 500 16px/1.6 var(--body); }
.cover { position: relative; min-height: 100%; overflow: hidden; display: flex; align-items: center;
  padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
.cover::before { content: ""; position: absolute; inset: 0; background: url(bg.jpg) 70% center / cover no-repeat; filter: saturate(1.1) contrast(1.06); transform: scale(1.03); }
.cover::after { content: ""; position: absolute; inset: 0; background:
  linear-gradient(90deg, rgba(7,9,13,.95) 0%, rgba(7,9,13,.84) 30%, rgba(7,9,13,.35) 55%, rgba(7,9,13,0) 72%),
  radial-gradient(130% 100% at 72% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.6) 100%); }
.in { position: relative; z-index: 1; width: min(640px, 100%); margin-left: clamp(0px, 5vw, 90px); }
.yr { font: 700 clamp(14px, 1.5vw, 18px)/1 var(--body); letter-spacing: .5em; color: var(--gold); }
h1 { margin: 14px 0 0; font: 900 clamp(52px, 8.4vw, 120px)/1 var(--display); letter-spacing: -.01em;
  background: linear-gradient(180deg, #fffaf0 0%, #f1dcae 55%, var(--gold-2) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,.85)); }
h1 span { display: block; }
h1 .pre { font-size: .5em; line-height: 1.25; margin-bottom: .08em; }
.tag { margin: 18px 0 0; padding-top: 16px; border-top: 2px solid; border-image: linear-gradient(90deg, var(--gold), transparent) 1;
  font: 700 clamp(18px, 2vw, 24px)/1.4 var(--display); color: var(--paper); text-shadow: 0 2px 12px rgba(0,0,0,.9); }
.tag b { color: #ff7a4c; }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 30px; }
.pick { display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 6px; text-decoration: none; color: var(--paper);
  background: rgba(10, 12, 16, .72); border: 2px solid var(--c); backdrop-filter: blur(4px); transition: transform .15s, background .15s; }
.pick:hover { transform: translateY(-2px); background: rgba(10, 12, 16, .88); }
.pick:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.pick.teach { --c: var(--gold); }
.pick.solo { --c: var(--rok); }
.pick b { font: 900 clamp(22px, 2.3vw, 28px)/1.2 var(--display); color: var(--c); }
.pick b::after { content: " ▸"; font-size: .8em; }
.pick span { font-size: 14px; color: var(--paper-dim); line-height: 1.5; }
.foot { margin-top: 22px; font-size: 13px; color: var(--paper-dim); text-shadow: 0 1px 8px rgba(0,0,0,.9); }
.foot a { color: var(--gold); }
.logo { position: absolute; z-index: 1; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
  width: clamp(56px, 6vw, 88px); height: auto; border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,.6); }
@media (max-width: 700px) {
  .cover { align-items: flex-end; }
  .cover::before { background-position: 62% 20%; }
  .cover::after { background: linear-gradient(0deg, rgba(7,9,13,.97) 0%, rgba(7,9,13,.88) 48%, rgba(7,9,13,.2) 80%); }
  .in { margin-left: 0; padding-bottom: 56px; }
  .picks { grid-template-columns: 1fr; }
  .logo { width: 48px; }
}
/* 폰 가로처럼 낮은 화면: 한 화면 안에 다 들어가도록 줄인다(스크롤 없음) */
@media (max-height: 560px) {
  .cover { align-items: center; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .cover::after { background: linear-gradient(90deg, rgba(7,9,13,.95) 0%, rgba(7,9,13,.85) 45%, rgba(7,9,13,.3) 75%, rgba(7,9,13,0) 90%); }
  .in { margin-left: 0; padding-bottom: 0; width: min(560px, 100%); }
  .yr { font-size: 11px; }
  h1 { margin-top: 6px; font-size: clamp(28px, 11vh, 52px); }
  .tag { margin-top: 8px; padding-top: 8px; font-size: 14px; }
  .picks { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .pick { padding: 9px 14px; gap: 2px; }
  .pick b { font-size: 19px; }
  .pick span { font-size: 12px; }
  .foot { margin-top: 8px; font-size: 11px; }
  .logo { width: 40px; }
}
html, body { overflow: hidden; }
.cover { height: 100%; min-height: 0; }
@media (prefers-reduced-motion: reduce) { .pick { transition: none; } }
</style>

  <div class="in">

    </nav>

  </div>
  <img class="logo" src="logo.png" alt="史AI 사이연구소">
</main>
</html>
