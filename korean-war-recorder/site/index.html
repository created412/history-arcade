<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지도로 보는 6·25 전쟁</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
/* 두 장면: ① 표지(제목만) → 「시작하기」 → ② 판 고르기. 둘 다 한 화면, 스크롤 없음 */
:root {
  --ink: #07090d; --paper: #f4ead2; --paper-dim: #c9bea4; --gold: #e6c878; --gold-2: #c9a24a; --rok: #6f97d6;
  --display: 'Noto Serif KR', 'Nanum Myeongjo', serif;
  --body: 'IBM Plex Sans KR', 'Noto Sans KR', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font: 500 16px/1.6 var(--body); }

/* 배경: 기록실 책상 위 지도. 고르기 화면에서는 더 어둡게, 살짝 확대 */
.bg { position: fixed; inset: 0; background: url(bg.jpg) 70% center / cover no-repeat; filter: saturate(1.1) contrast(1.06); transform: scale(1.03); transition: transform 1.1s ease, filter 1.1s ease; }
.bg::after { content: ""; position: absolute; inset: 0; background:
  linear-gradient(90deg, rgba(7,9,13,.95) 0%, rgba(7,9,13,.82) 30%, rgba(7,9,13,.3) 55%, rgba(7,9,13,0) 72%),
  radial-gradient(130% 100% at 72% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.6) 100%); }
body.picking .bg { transform: scale(1.12); filter: saturate(.9) brightness(.42) blur(2px); }

.scene { position: fixed; inset: 0; display: flex; align-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  transition: opacity .7s ease, transform .7s ease, visibility 0s linear 0s; }
.scene[aria-hidden="true"] { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .6s ease, transform .6s ease, visibility 0s linear .6s; }

/* ① 표지 */
#cover .in { width: min(680px, 100%); margin-left: clamp(0px, 6vw, 110px); }
#cover[aria-hidden="true"] { transform: translateY(-40px); }
.yr { font: 700 clamp(13px, 1.5vw, 18px)/1 var(--body); letter-spacing: .5em; color: var(--gold); }
h1 { margin: 14px 0 0; font: 900 clamp(56px, 9vw, 132px)/1 var(--display); letter-spacing: -.01em;
  background: linear-gradient(180deg, #fffaf0 0%, #f1dcae 55%, var(--gold-2) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,.85)); }
h1 span { display: block; }
h1 .pre { font-size: .48em; line-height: 1.25; margin-bottom: .06em; }
.tag { margin: 20px 0 0; padding-top: 16px; border-top: 2px solid; border-image: linear-gradient(90deg, var(--gold), transparent) 1;
  font: 700 clamp(17px, 2vw, 24px)/1.4 var(--display); text-shadow: 0 2px 12px rgba(0,0,0,.9); }
.tag b { color: #ff7a4c; }
.start { margin-top: 34px; display: inline-flex; align-items: center; gap: 12px; padding: 16px 30px; border: 0; border-radius: 4px; cursor: pointer;
  font: 900 clamp(18px, 1.8vw, 22px)/1 var(--display); color: var(--ink); background: linear-gradient(180deg, #f3d891, var(--gold-2)); box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: transform .15s, filter .15s; }
.start:hover { transform: translateY(-2px); filter: brightness(1.06); }
.start span { font-size: .8em; }

/* ② 판 고르기 */
#pick { justify-content: center; }
#pick[aria-hidden="true"] { transform: translateY(40px); }
#pick .in { width: min(920px, 100%); text-align: center; }
#pick h2 { margin: 0; font: 900 clamp(28px, 3.6vw, 44px)/1.25 var(--display); text-shadow: 0 4px 18px rgba(0,0,0,.8); }
#pick .lead { margin: 8px 0 0; color: var(--paper-dim); }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; text-align: left; }
.pick { display: flex; flex-direction: column; gap: 10px; padding: 26px 26px 24px; border-radius: 6px; text-decoration: none; color: var(--paper);
  background: rgba(10, 12, 16, .78); border: 2px solid var(--c); border-top-width: 6px; transition: transform .15s, background .15s; }
.pick:hover { transform: translateY(-3px); background: rgba(16, 19, 25, .92); }
.pick.teach { --c: var(--gold); }
.pick.solo { --c: var(--rok); }
.pick small { font: 700 12px/1 var(--body); letter-spacing: .2em; color: var(--c); }
.pick b { font: 900 clamp(28px, 3vw, 38px)/1.15 var(--display); color: var(--paper); }
.pick ul { margin: 0; padding-left: 1.1em; color: var(--paper-dim); font-size: 15px; display: grid; gap: 3px; }
.pick .go { margin-top: 6px; align-self: flex-start; font: 700 15px/1 var(--body); padding: 11px 16px; border-radius: 4px; background: var(--c); color: var(--ink); }
.row { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px 18px; margin-top: 22px; font-size: 13px; color: var(--paper-dim); }
.row a, .back { color: var(--gold); }
.back { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; }

.start:focus-visible, .pick:focus-visible, .back:focus-visible, .row a:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.logo { position: fixed; z-index: 2; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
  width: clamp(48px, 5.6vw, 84px); height: auto; border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,.6); }

@media (max-width: 700px) {
  .bg { background-position: 62% 20%; }
  .bg::after { background: linear-gradient(0deg, rgba(7,9,13,.97) 0%, rgba(7,9,13,.85) 50%, rgba(7,9,13,.2) 82%); }
  #cover { align-items: flex-end; }
  #cover .in { margin-left: 0; padding-bottom: 64px; }
  .picks { grid-template-columns: 1fr; gap: 12px; margin-top: 18px; }
  .pick { padding: 16px 18px; gap: 6px; }
  .pick ul { font-size: 13.5px; }
  .logo { width: 44px; }
}
/* 폰 가로처럼 낮은 화면 */
@media (max-height: 560px) {
  .scene { padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #cover { align-items: center; }
  #cover .in { margin-left: 0; padding-bottom: 0; }
  h1 { margin-top: 6px; font-size: clamp(30px, 13vh, 64px); }
  .yr { font-size: 11px; }
  .tag { margin-top: 10px; padding-top: 8px; font-size: 15px; }
  .start { margin-top: 14px; padding: 11px 20px; font-size: 16px; }
  #pick h2 { font-size: 22px; }
  #pick .lead { display: none; }
  .picks { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .pick { padding: 12px 14px; gap: 4px; border-top-width: 4px; }
  .pick b { font-size: 22px; }
  .pick ul { font-size: 12px; gap: 0; }
  .pick .go { padding: 7px 12px; font-size: 13px; margin-top: 2px; }
  .row { margin-top: 10px; font-size: 11.5px; }
  .logo { width: 38px; }
}
@media (prefers-reduced-motion: reduce) { .bg, .scene, .scene[aria-hidden="true"], .start, .pick { transition: none; } }
</style>

<div class="bg" aria-hidden="true"></div>

<main>
  <section class="scene" id="cover" aria-label="표지">
    <div class="in">
      <div class="yr">1945 – 1953</div>
      <h1><span class="pre">지도로 보는</span><span>6·25 전쟁</span></h1>
      <p class="tag">광복에서 정전까지, <b>전선</b>이 움직인 8년</p>
      <button class="start" id="start" type="button">시작하기 <span>▸</span></button>
    </div>
  </section>

  <section class="scene" id="pick" aria-label="판 고르기" aria-hidden="true">
    <div class="in">
      <h2>어떻게 함께할까요?</h2>
      <p class="lead">내용은 같아요. 누가 설명하느냐가 달라요.</p>
      <nav class="picks" aria-label="판">
        <a class="pick teach" href="teach.html" tabindex="-1">
          <small>교실 · 교사 진행</small>
          <b>수업용</b>
          <ul><li>선생님이 설명하며 넘겨요</li><li>리모컨 → · H 키로 설명자료</li><li>기록을 남기지 않아요</li></ul>
          <span class="go">수업 시작 ▸</span>
        </a>
        <a class="pick solo" href="solo.html" tabindex="-1">
          <small>집 · 혼자 복습</small>
          <b>복습용</b>
          <ul><li>학예사가 목소리로 안내해요</li><li>닫아도 이어서 할 수 있어요</li><li>마지막에 기록관 보고서</li></ul>
          <span class="go">복습 시작 ▸</span>
        </a>
      </nav>
      <div class="row">
        <button class="back" id="back" type="button" tabindex="-1">◂ 표지로</button>
        <span>고등학교 『한국사』 72~73·88~91쪽 · 약 30분</span>
        <a href="https://github.com/created412/history-arcade/blob/main/korean-war-recorder/index.html" target="_blank" rel="noopener" tabindex="-1">오프라인 파일</a>
      </div>
    </div>
  </section>
</main>

<img class="logo" src="logo.png" alt="史AI 사이연구소">

<script>
  const cover = document.getElementById('cover'), pick = document.getElementById('pick');
  const focusables = (el) => el.querySelectorAll('a, button');
  const onPick = () => pick.getAttribute('aria-hidden') === 'false';
  function show(which, push) {
    const toPick = which === 'pick';
    cover.setAttribute('aria-hidden', toPick ? 'true' : 'false');
    pick.setAttribute('aria-hidden', toPick ? 'false' : 'true');
    focusables(cover).forEach((e) => (e.tabIndex = toPick ? -1 : 0));
    focusables(pick).forEach((e) => (e.tabIndex = toPick ? 0 : -1));
    document.body.classList.toggle('picking', toPick);
    if (push) history.pushState(null, '', toPick ? '#pick' : location.pathname);
    setTimeout(() => (toPick ? pick.querySelector('.pick') : document.getElementById('start')).focus({ preventScroll: true }), 350);
  }
  document.getElementById('start').onclick = () => show('pick', true);
  document.getElementById('back').onclick = () => show('cover', true);
  addEventListener('popstate', () => show(location.hash === '#pick' ? 'pick' : 'cover', false));
  // 발표용 리모컨·키보드: 표지에서 → / PageDown / Enter / Space 로 다음 화면, 고르기에서 ← / PageUp / Esc 로 표지
  addEventListener('keydown', (e) => {
    if (!onPick() && ['ArrowRight', 'PageDown', 'Enter', ' '].includes(e.key)) { e.preventDefault(); show('pick', true); }
    else if (onPick() && ['ArrowLeft', 'PageUp', 'Escape'].includes(e.key)) { e.preventDefault(); show('cover', true); }
  });
  // 게임의 「다른 판 고르기」에서 돌아오면(#pick) 바로 고르기 화면
  if (location.hash === '#pick') show('pick', false);
</script>
</html>
